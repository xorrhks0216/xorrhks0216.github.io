<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>성범죄자 주소 지도</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; font-family: sans-serif; }
  #map { width: 100%; height: 100%; }
  #status {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    z-index: 10; background: rgba(255,255,255,.95); padding: 8px 14px;
    border-radius: 8px; font-size: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.3);
  }
  #failed {
    position: absolute; bottom: 10px; left: 10px; z-index: 10; max-width: 320px;
    background: rgba(255,255,255,.95); border-radius: 8px; padding: 8px 12px;
    font-size: 12px; display: none; box-shadow: 0 1px 4px rgba(0,0,0,.3);
  }
</style>
</head>
<body>
<div id="status">로딩 중...</div>
<div id="map"></div>
<div id="failed"></div>

<!-- 카카오 개발자 사이트에서 발급받은 JavaScript 키로 교체할 것 -->
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=adde6fb3ba7173d26d38b2ea1cf1946e&libraries=services&autoload=false"></script>
<script>
function parseData() {
  const m = location.hash.match(/#d=([A-Za-z0-9\-_]+)/);
  if (!m) return null;
  try {
    const b64 = m[1].replace(/-/g, "+").replace(/_/g, "/");
    return JSON.parse(decodeURIComponent(escape(atob(b64))));
  } catch (e) { return null; }
}

const statusEl = document.getElementById("status");
const people = parseData();

kakao.maps.load(function () {
  if (!people || people.length === 0) {
    statusEl.textContent = "표시할 데이터가 없습니다. 알림e 검색 결과 페이지에서 '지도로 보기' 버튼을 눌러주세요.";
    return;
  }

  const map = new kakao.maps.Map(document.getElementById("map"), {
    center: new kakao.maps.LatLng(37.5665, 126.9780), level: 7,
  });
  const geocoder = new kakao.maps.services.Geocoder();
  const bounds = new kakao.maps.LatLngBounds();
  const failed = [];
  let done = 0, ok = 0;

  function geocodeOne(addr) {
    return new Promise((resolve) => {
      geocoder.addressSearch(addr, (result, status) => {
        resolve(status === kakao.maps.services.Status.OK ? result[0] : null);
      });
    });
  }

  (async function run() {
    // 카카오 지오코딩 쿼터 보호를 위해 약간의 간격을 두고 순차 처리
    for (const p of people) {
      const addr = p.liveAddr || p.regAddr;
      let r = await geocodeOne(addr);
      if (!r && p.regAddr && p.regAddr !== addr) r = await geocodeOne(p.regAddr);
      done++;
      statusEl.textContent = `지오코딩 중... ${done}/${people.length}`;
      if (r) {
        ok++;
        const pos = new kakao.maps.LatLng(r.y, r.x);
        bounds.extend(pos);
        const marker = new kakao.maps.Marker({ map, position: pos });
        const iw = new kakao.maps.InfoWindow({
          content: `<div style="padding:8px;font-size:13px;min-width:180px"><b>${p.name}</b><br>${addr}</div>`,
        });
        kakao.maps.event.addListener(marker, "click", () => iw.open(map, marker));
      } else {
        failed.push(`${p.name}: ${addr}`);
      }
      await new Promise((res) => setTimeout(res, 120));
    }
    statusEl.textContent = `총 ${people.length}명 중 ${ok}명 표시됨`;
    if (ok > 0) map.setBounds(bounds);
    if (failed.length) {
      const el = document.getElementById("failed");
      el.style.display = "block";
      el.innerHTML = "<b>좌표 변환 실패:</b><br>" + failed.join("<br>");
    }
  })();
});
</script>
</body>
</html>
