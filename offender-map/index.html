<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>성범죄자 주소 지도</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; font-family: sans-serif; }
  #map { width: 100%; height: 100%; }
  #status {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    z-index: 10; background: rgba(255,255,255,.95); padding: 8px 14px;
    border-radius: 8px; font-size: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.3);
    white-space: nowrap;
  }
  #myLoc {
    position: absolute; top: 10px; right: 10px; z-index: 10;
    background: #fff; border: 1px solid #ccc; border-radius: 8px;
    padding: 8px 12px; font-size: 14px; cursor: pointer;
    box-shadow: 0 1px 4px rgba(0,0,0,.3);
  }
  #myLoc:hover { background: #f0f0f0; }
  #failed {
    position: absolute; bottom: 10px; left: 10px; z-index: 10; max-width: 320px;
    background: rgba(255,255,255,.95); border-radius: 8px; padding: 8px 12px;
    font-size: 12px; display: none; box-shadow: 0 1px 4px rgba(0,0,0,.3);
  }
  #version {
    position: absolute; bottom: 10px; right: 10px; z-index: 10;
    font-size: 11px; color: #888; background: rgba(255,255,255,.8);
    padding: 2px 6px; border-radius: 4px;
  }
  .name-label {
    background: rgba(255,255,255,.92); border: 1px solid #d9534f;
    border-radius: 4px; padding: 1px 6px; font-size: 12px; font-weight: bold;
    color: #d9534f; white-space: nowrap; transform: translateY(2px);
  }
</style>
</head>
<body>
<div id="status">로딩 중...</div>
<button id="myLoc">📍 내 위치</button>
<div id="map"></div>
<div id="version">v20250111-4</div>
<div id="failed"></div>

<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=adde6fb3ba7173d26d38b2ea1cf1946e&libraries=services&autoload=false"></script>
<script>
function parseData() {
  const m = location.hash.match(/#d=([A-Za-z0-9\-_]+)/);
  if (!m) return null;
  try {
    const b64 = m[1].replace(/-/g, "+").replace(/_/g, "/");
    return JSON.parse(decodeURIComponent(escape(atob(b64))));
  } catch (e) { return null; }
}

const statusEl = document.getElementById("status");
const people = parseData();

kakao.maps.load(function () {
  const map = new kakao.maps.Map(document.getElementById("map"), {
    center: new kakao.maps.LatLng(37.5665, 126.9780), level: 7,
  });

  // 내 위치 버튼
  let myMarker = null;
  document.getElementById("myLoc").addEventListener("click", () => {
    if (!navigator.geolocation) { alert("위치 정보를 지원하지 않는 브라우저입니다."); return; }
    navigator.geolocation.getCurrentPosition((pos) => {
      const latlng = new kakao.maps.LatLng(pos.coords.latitude, pos.coords.longitude);
      if (myMarker) myMarker.setMap(null);
      myMarker = new kakao.maps.Marker({
        map, position: latlng,
        image: new kakao.maps.MarkerImage(
          "https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/markerStar.png",
          new kakao.maps.Size(24, 35)),
      });
      map.setCenter(latlng);
    }, () => alert("위치 정보를 가져올 수 없습니다. 브라우저 위치 권한을 확인해 주세요."));
  });

  if (!people || people.length === 0) {
    statusEl.textContent = "표시할 데이터가 없습니다. 알림e 검색 결과 페이지에서 '지도로 보기' 버튼을 눌러주세요.";
    return;
  }

  const geocoder = new kakao.maps.services.Geocoder();
  const bounds = new kakao.maps.LatLngBounds();
  const failed = [];
  let done = 0, ok = 0;
  let openIw = null;

  // 지도 빈 곳 클릭 시 열린 팝업 닫기
  kakao.maps.event.addListener(map, "click", () => {
    if (openIw) { openIw.close(); openIw = null; }
  });

  function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;"); }

  function geocodeOne(addr) {
    return new Promise((resolve) => {
      geocoder.addressSearch(addr, (result, status) => {
        resolve(status === kakao.maps.services.Status.OK ? result[0] : null);
      });
    });
  }

  // 주소 → 좌표 캐시 (localStorage, 영구 보관)
  const CACHE_KEY = "om_geocache_v1";
  let cache = {};
  try { cache = JSON.parse(localStorage.getItem(CACHE_KEY) || "{}"); } catch {}
  let cacheDirty = false;
  setInterval(() => {
    if (cacheDirty) { localStorage.setItem(CACHE_KEY, JSON.stringify(cache)); cacheDirty = false; }
  }, 2000);

  async function resolveAddr(p) {
    const addr = p.liveAddr || p.regAddr;
    if (cache[addr]) return { addr, pos: cache[addr] };
    let r = await geocodeOne(addr);
    if (!r && p.regAddr && p.regAddr !== addr) r = await geocodeOne(p.regAddr);
    if (r) {
      cache[addr] = { y: r.y, x: r.x };
      cacheDirty = true;
      return { addr, pos: cache[addr] };
    }
    return { addr, pos: null };
  }

  (async function run() {
    const CONCURRENCY = 10;
    let idx = 0;

    function place(p, addr, pos) {
      ok++;
      const latlng = new kakao.maps.LatLng(pos.y, pos.x);
      bounds.extend(latlng);
      const marker = new kakao.maps.Marker({ map, position: latlng });

      new kakao.maps.CustomOverlay({
        map, position: latlng, yAnchor: -0.3,
        content: `<div class="name-label">${esc(p.name)}</div>`,
      });

      const q = encodeURIComponent(`성범죄자 ${p.name}`);
      const iw = new kakao.maps.InfoWindow({
        removable: true,
        content: `<div style="padding:10px;font-size:13px;min-width:200px">
          <b>${esc(p.name)}</b><br>${esc(addr)}<br>
          <a href="https://search.naver.com/search.naver?where=news&query=${q}" target="_blank">네이버 뉴스</a> ·
          <a href="https://news.google.com/search?q=${q}&hl=ko&gl=KR" target="_blank">구글 뉴스</a>
        </div>`,
      });
      kakao.maps.event.addListener(marker, "click", () => {
        if (openIw) openIw.close();
        iw.open(map, marker);
        openIw = iw;
      });
      kakao.maps.event.addListener(iw, "close", () => { openIw = null; });
    }

    async function worker() {
      while (idx < people.length) {
        const p = people[idx++];
        const { addr, pos } = await resolveAddr(p);
        done++;
        statusEl.textContent = `지오코딩 중... ${done}/${people.length}`;
        if (pos) place(p, addr, pos);
        else failed.push(`${p.name}: ${addr}`);
      }
    }

    await Promise.all(Array.from({ length: CONCURRENCY }, worker));
    localStorage.setItem(CACHE_KEY, JSON.stringify(cache));

    statusEl.textContent = `총 ${people.length}명 중 ${ok}명 표시됨`;
    if (ok > 0) map.setBounds(bounds);
    if (failed.length) {
      const el = document.getElementById("failed");
      el.style.display = "block";
      el.innerHTML = "<b>좌표 변환 실패:</b><br>" + failed.map(esc).join("<br>");
    }
  })();
});
</script>
</body>
</html>
